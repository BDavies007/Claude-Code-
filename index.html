<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beyond Green — Operating &amp; Reporting System (BG-ORS)</title>
  <meta name="description" content="Beyond Green Group operations dashboard and reporting tool. Zero-dependency vanilla JS." />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23198754'/%3E%3Cpath d='M16 6c-5 4-7 8-7 12a7 7 0 0014 0c0-4-2-8-7-12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28" role="img" aria-label="Beyond Green logo">
          <rect width="32" height="32" rx="6" fill="#198754"></rect>
          <path d="M16 6c-5 4-7 8-7 12a7 7 0 0014 0c0-4-2-8-7-12z" fill="#fff"></path>
        </svg>
      </span>
      <div class="brand-text">
        <strong>Beyond Green</strong>
        <small>Operating &amp; Reporting System</small>
      </div>
    </div>

    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation">
      &#9776;
    </button>

    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/sites" data-route="sites">Sites</a>
      <a href="#/operations" data-route="operations">Operations</a>
      <a href="#/tasks" data-route="tasks">Tasks</a>
      <a href="#/reports" data-route="reports">Reports</a>
    </nav>
  </header>

  <main id="main" class="app-main" tabindex="-1">
    <div id="view-root" class="view-root" aria-live="polite"></div>
  </main>

  <footer class="app-footer">
    <span>Beyond Green Group &mdash; BG-ORS</span>
    <span class="footer-tools">
      <button type="button" class="link-btn" id="reset-demo">Reset demo data</button>
      <span class="muted">Zero-dependency vanilla JS</span>
    </span>
  </footer>

  <!-- Modal container -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Dialog</h2>
        <button type="button" class="icon-btn" id="modal-close" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>

  <!-- Scripts loaded in dependency order. No ES modules (works over file://). -->
  <script src="assets/js/store.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/reports.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>

# Supabase local dev configuration for Executive OS.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "executive-os"

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# Allow email/password sign-in without email confirmation in local dev.
enable_confirmations = false

[auth.email]
enable_signup = true
enable_confirmations = false

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
